<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #2a2a2a;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 3px solid #ffd700;
        }

        .name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #444;
        }

        .section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffd700;
        }

        .section-content {
            font-size: 14px;
            line-height: 1.6;
            color: #ddd;
        }

        a {
            color: #ffd700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="YOUR_IMAGE_URL_HERE" alt="Avatar" class="avatar">
            <div class="name">Your Name</div>
        </div>

        <div class="section">
            <div class="section-title">▶ Bio</div>
            <div class="section-content">
                Add your bio/introduction here!
            </div>
        </div>

        <div class="section">
            <div class="section-title">▶ Interests</div>
            <div class="section-content">
                Interest 1<br>
                Interest 2<br>
                Interest 3
            </div>
        </div>

        <div class="section">
            <div class="section-title">▶ Links</div>
            <div class="section-content">
                <a href="https://twitter.com">Twitter</a><br>
                <a href="https://instagram.com">Instagram</a><br>
                <a href="https://github.com">GitHub</a>
            </div>
        </div>

        <div class="section">
            <div class="section-title">▶ DNI</div>
            <div class="section-content">
                Add things people should avoid mentioning
            </div>
        </div>
    </div>
</body>
</html>
